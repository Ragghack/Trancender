<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CAPITAIN</title>
  <style>
    /* ─── RESET ─── */
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --green: #22c55e;
      --green-dark: #16a34a;
      --green-glow: rgba(34, 197, 94, 0.25);
      --green-hover: rgba(34, 197, 94, 0.45);
      --red: #e50914;
      --red-glow: rgba(229, 9, 20, 0.15);
    }

    body {
      background: #000;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      position: relative;
      overflow: hidden;
    }

    /* ─── FLOATING WHATSAPP LOGOS ─── */
    .bg-logos {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }

    .bg-logos svg {
      position: absolute;
      opacity: 0.04;
      fill: #25d366;
      animation: floatLogo 20s linear infinite;
      width: 80px;
      height: 80px;
    }

    /* Different sizes and positions */
    .bg-logos svg:nth-child(1) {
      top: 5%;
      left: 5%;
      width: 60px;
      height: 60px;
      animation-duration: 22s;
      animation-delay: 0s;
    }
    .bg-logos svg:nth-child(2) {
      top: 15%;
      right: 8%;
      width: 100px;
      height: 100px;
      animation-duration: 25s;
      animation-delay: 2s;
    }
    .bg-logos svg:nth-child(3) {
      bottom: 20%;
      left: 3%;
      width: 120px;
      height: 120px;
      animation-duration: 28s;
      animation-delay: 4s;
    }
    .bg-logos svg:nth-child(4) {
      bottom: 10%;
      right: 5%;
      width: 70px;
      height: 70px;
      animation-duration: 20s;
      animation-delay: 1s;
    }
    .bg-logos svg:nth-child(5) {
      top: 45%;
      left: 2%;
      width: 90px;
      height: 90px;
      animation-duration: 24s;
      animation-delay: 3s;
    }
    .bg-logos svg:nth-child(6) {
      top: 40%;
      right: 2%;
      width: 110px;
      height: 110px;
      animation-duration: 26s;
      animation-delay: 5s;
    }
    .bg-logos svg:nth-child(7) {
      top: 70%;
      left: 10%;
      width: 50px;
      height: 50px;
      animation-duration: 18s;
      animation-delay: 6s;
    }
    .bg-logos svg:nth-child(8) {
      top: 10%;
      left: 45%;
      width: 130px;
      height: 130px;
      animation-duration: 30s;
      animation-delay: 1.5s;
    }
    .bg-logos svg:nth-child(9) {
      bottom: 30%;
      right: 15%;
      width: 85px;
      height: 85px;
      animation-duration: 23s;
      animation-delay: 3.5s;
    }
    .bg-logos svg:nth-child(10) {
      top: 55%;
      left: 25%;
      width: 140px;
      height: 140px;
      animation-duration: 32s;
      animation-delay: 2.5s;
    }
    .bg-logos svg:nth-child(11) {
      bottom: 5%;
      left: 35%;
      width: 95px;
      height: 95px;
      animation-duration: 21s;
      animation-delay: 4.5s;
    }
    .bg-logos svg:nth-child(12) {
      top: 25%;
      left: 60%;
      width: 75px;
      height: 75px;
      animation-duration: 19s;
      animation-delay: 5.5s;
    }

    @keyframes floatLogo {
      0% {
        transform: translate(0, 0) rotate(0deg) scale(1);
        opacity: 0.02;
      }
      10% {
        opacity: 0.06;
      }
      25% {
        transform: translate(30px, -40px) rotate(90deg) scale(1.1);
        opacity: 0.08;
      }
      50% {
        transform: translate(-20px, 60px) rotate(180deg) scale(0.9);
        opacity: 0.05;
      }
      75% {
        transform: translate(40px, -30px) rotate(270deg) scale(1.05);
        opacity: 0.07;
      }
      90% {
        opacity: 0.03;
      }
      100% {
        transform: translate(0, 0) rotate(360deg) scale(1);
        opacity: 0.02;
      }
    }

    /* ─── MAIN CARD ─── */
    .profile-card {
      width: 100%;
      max-width: 420px;
      background: rgba(10, 10, 10, 0.92);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-radius: 28px;
      overflow: hidden;
      box-shadow: 0 8px 40px rgba(0, 0, 0, 0.7), 0 0 60px rgba(34, 197, 94, 0.03);
      transition: transform 0.35s ease, box-shadow 0.35s ease;
      position: relative;
      z-index: 1;
      border: 1px solid rgba(34, 197, 94, 0.05);
    }

    .profile-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 16px 56px rgba(0, 0, 0, 0.85), 0 0 80px var(--red-glow);
    }

    /* ─── HERO IMAGE ─── */
    .hero {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 10;
      overflow: hidden;
      background: #0a0a0a;
    }

    .hero img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      transition: transform 0.6s cubic-bezier(0.25, 0.46, 0.45, 0.94);
      display: block;
    }

    .profile-card:hover .hero img {
      transform: scale(1.04);
    }

    /* ─── GRADIENT OVERLAY ─── */
    .hero::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(
        to bottom,
        rgba(229, 9, 20, 0.15) 0%,
        transparent 25%,
        transparent 55%,
        rgba(0, 0, 0, 0.5) 75%,
        rgba(0, 0, 0, 0.9) 100%
      );
      pointer-events: none;
    }

    /* ─── TEXT OVERLAY ─── */
    .hero-text {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      z-index: 2;
      padding: 0 24px 28px;
      text-align: center;
    }

    .hero-title {
      font-family: 'Inter', sans-serif;
      font-weight: 900;
      font-size: clamp(36px, 10vw, 52px);
      color: #fff;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      line-height: 1.0;
      text-shadow: 0 2px 30px rgba(0, 0, 0, 0.8);
      background: linear-gradient(135deg, #ffffff 30%, #e50914 70%, #ff6b6b 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .hero-sub {
      margin-top: 8px;
      font-weight: 600;
      font-size: clamp(10px, 2.5vw, 12px);
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: #ff6b6b;
      text-shadow: 0 2px 20px rgba(0, 0, 0, 0.8);
    }

    .hero-sub::before {
      content: '● ';
      color: #e50914;
    }

    /* ─── CONTENT ─── */
    .content {
      padding: 20px 24px 30px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      background: transparent;
    }

    /* ─── CLICK TEXT ─── */
    .click-text {
      color: rgba(255, 255, 255, 0.5);
      font-size: 0.85rem;
      font-weight: 500;
      letter-spacing: 0.5px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .click-text svg {
      animation: bounce 1.4s ease-in-out infinite;
      flex-shrink: 0;
    }

    @keyframes bounce {
      0%,
      100% {
        transform: translateY(0);
      }
      50% {
        transform: translateY(6px);
      }
    }

    /* ─── WHATSAPP BUTTON ─── */
    .wa-card {
      display: flex;
      align-items: center;
      gap: 16px;
      width: 100%;
      background: rgba(17, 17, 17, 0.9);
      border: 2px solid var(--green);
      border-radius: 20px;
      padding: 16px 20px;
      text-decoration: none;
      box-shadow: 0 0 20px var(--green-glow), inset 0 0 0 0 transparent;
      transition: all 0.3s ease;
      cursor: pointer;
      position: relative;
      overflow: hidden;
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
    }

    .wa-card::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(34, 197, 94, 0.05), transparent);
      pointer-events: none;
    }

    .wa-card:hover {
      box-shadow: 0 0 40px var(--green-hover), 0 6px 24px rgba(0, 0, 0, 0.55);
      transform: translateY(-2px);
      border-color: #4ade80;
    }

    .wa-card:active {
      transform: translateY(2px);
    }

    /* ─── ICON WITH RIPPLE ─── */
    .wa-icon-wrapper {
      position: relative;
      width: 52px;
      height: 52px;
      flex-shrink: 0;
    }

    .wa-ripple {
      position: absolute;
      inset: -4px;
      border-radius: 50%;
      border: 2px solid var(--green);
      animation: ripple 2.5s ease-out infinite;
      opacity: 0;
    }

    .wa-ripple:nth-child(2) {
      animation-delay: 0.6s;
    }
    .wa-ripple:nth-child(3) {
      animation-delay: 1.2s;
    }

    @keyframes ripple {
      0% {
        transform: scale(0.8);
        opacity: 0.6;
      }
      100% {
        transform: scale(1.8);
        opacity: 0;
      }
    }

    .wa-icon {
      width: 52px;
      height: 52px;
      background: var(--green);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 20px rgba(34, 197, 94, 0.4);
      transition: box-shadow 0.3s ease, transform 0.3s ease;
      position: relative;
      z-index: 1;
      animation: heartbeat 2.5s ease-in-out infinite;
    }

    .wa-card:hover .wa-icon {
      box-shadow: 0 0 40px rgba(34, 197, 94, 0.7);
      transform: scale(1.05);
    }

    @keyframes heartbeat {
      0% {
        transform: scale(1);
      }
      14% {
        transform: scale(1.1);
      }
      28% {
        transform: scale(1);
      }
      42% {
        transform: scale(1.06);
      }
      56% {
        transform: scale(1);
      }
      100% {
        transform: scale(1);
      }
    }

    .wa-icon svg {
      width: 28px;
      height: 28px;
      fill: #fff;
    }

    /* ─── BUTTON TEXT ─── */
    .wa-text {
      display: flex;
      flex-direction: column;
      gap: 2px;
      position: relative;
      z-index: 1;
    }

    .wa-label {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--green);
    }

    .wa-action {
      font-size: 15px;
      font-weight: 600;
      color: #fff;
    }

    /* ─── LIVE DOT ─── */
    .live-dot {
      display: inline-block;
      width: 8px;
      height: 8px;
      background: var(--green);
      border-radius: 50%;
      margin-right: 6px;
      animation: livePulse 2s ease-in-out infinite;
    }

    @keyframes livePulse {
      0%,
      100% {
        box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.6);
      }
      50% {
        box-shadow: 0 0 0 8px rgba(34, 197, 94, 0);
      }
    }

    /* ─── REDUCED MOTION ─── */
    @media (prefers-reduced-motion: reduce) {
      .hero img,
      .profile-card,
      .wa-card,
      .wa-icon,
      .click-text svg,
      .wa-ripple,
      .bg-logos svg {
        transition: none;
        animation: none !important;
      }
    }

    /* ─── RESPONSIVE ─── */
    @media (max-width: 480px) {
      .content {
        padding: 16px 16px 24px;
        gap: 8px;
      }

      .wa-card {
        padding: 14px 16px;
        gap: 12px;
      }

      .wa-icon-wrapper,
      .wa-icon {
        width: 44px;
        height: 44px;
      }

      .wa-icon svg {
        width: 24px;
        height: 24px;
      }

      .wa-action {
        font-size: 13px;
      }

      .wa-label {
        font-size: 9px;
      }

      .click-text {
        font-size: 0.75rem;
      }

      .hero-text {
        padding: 0 16px 20px;
      }

      .bg-logos svg {
        width: 50px !important;
        height: 50px !important;
        opacity: 0.03;
      }
    }

    @media (max-width: 380px) {
      .profile-card {
        border-radius: 20px;
      }

      .wa-card {
        padding: 12px 14px;
        gap: 10px;
        border-radius: 16px;
      }

      .wa-icon-wrapper,
      .wa-icon {
        width: 38px;
        height: 38px;
      }

      .wa-icon svg {
        width: 20px;
        height: 20px;
      }

      .wa-action {
        font-size: 11px;
      }

      .wa-label {
        font-size: 8px;
      }

      .click-text {
        font-size: 0.65rem;
      }

      .bg-logos svg {
        width: 40px !important;
        height: 40px !important;
        opacity: 0.02;
      }
    }
  </style>
</head>
